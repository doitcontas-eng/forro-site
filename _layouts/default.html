<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ page.url | prepend: site.url | prepend: site.baseurl }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | prepend: site.baseurl }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | prepend: site.baseurl }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | prepend: site.url | prepend: site.baseurl }}">

  <meta name="google-adsense-account" content="ca-pub-9709003405865016">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}",
    "description": "{{ site.description }}",
    "inLanguage": "pt-BR",
    "publisher": {
      "@type": "Person",
      "name": "Renato Alencar",
      "url": "{{ site.url }}/sobre"
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": "{{ site.url }}/?s={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9709003405865016" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="{{ '/' | prepend: site.baseurl }}">🎵 {{ site.title }}</a>
      <nav>
        <a href="{{ '/' | prepend: site.baseurl }}">Início</a>
        <a href="{{ '/sobre' | prepend: site.baseurl }}">Sobre</a>
        <a href="{{ '/contato' | prepend: site.baseurl }}">Contato</a>
        <a href="{{ '/privacidade' | prepend: site.baseurl }}">Privacidade</a>
      </nav>
    </div>
  </header>

  <!-- ADSENSE: Banner topo -->
  <!-- <div class="ad-banner container">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXX" data-ad-slot="XXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div> -->

  <main class="container">
    {{ content }}
  </main>

  <!-- ADSENSE: Banner rodapé -->
  <!-- <div class="ad-banner container">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXX" data-ad-slot="XXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div> -->

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }} · Feito com ❤️ e muito baião</p>
    </div>
  </footer>
</body>
</html>
