name: Gerar Artigo Semanal

on:
  schedule:
    # Todo dia às 09:00 BRT (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Permite rodar manualmente pela aba Actions do GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt


      - name: Gerar artigo com Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate_article.py

      - name: Commit e push do novo artigo
        run: |
          git config --global user.name 'Forró Bot'
          git config --global user.email 'forro-bot@noreply.github.com'
          git add _posts/
          git diff --staged --quiet && echo "Nenhum artigo novo" || (
            git commit -m "Novo artigo: $(date +'%Y-%m-%d')" &&
            git push
          )
